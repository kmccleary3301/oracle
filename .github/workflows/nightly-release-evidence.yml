name: Nightly release evidence

on:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      lane:
        description: "Promotion runs claim evidence only after the required soak duration; smoke is explicitly unclaimed."
        required: true
        default: promotion
        type: choice
        options: [promotion, smoke]
      duration_ms:
        description: "Soak duration in milliseconds (promotion requires 28800000)."
        required: true
        default: "28800000"
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  cross-platform-evidence:
    name: ${{ matrix.platform }} evidence
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            hosted: macos-latest
            promotion_runner: release-evidence-macos
          - platform: linux
            hosted: ubuntu-latest
            promotion_runner: release-evidence-linux
          - platform: windows
            hosted: windows-latest
            promotion_runner: release-evidence-windows
    # Promotion requires configured self-hosted runners because GitHub-hosted jobs
    # cannot provide the required eight-hour uninterrupted soak.
    runs-on: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.lane == 'promotion')) && matrix.promotion_runner || matrix.hosted }}
    env:
      EVIDENCE_LANE: ${{ github.event_name == 'schedule' && 'promotion' || github.event_name == 'workflow_dispatch' && inputs.lane || 'smoke' }}
      SOAK_DURATION_MS: ${{ github.event_name == 'schedule' && '28800000' || github.event_name == 'workflow_dispatch' && inputs.duration_ms || '5000' }}
      REQUIRED_SOAK_DURATION_MS: "28800000"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Run focused fault and chaos proofs
        run: pnpm exec vitest run tests/benchmark/resourceCycleProof.test.ts tests/browser/resourceGovernor.test.ts tests/browser/resourceTelemetry.test.ts
      - name: Record browser resource baseline
        run: pnpm benchmark:browser-resource --output ".release-evidence/resource-${{ matrix.platform }}.json"
      - name: Run configurable resource soak
        run: pnpm benchmark:resource-soak --duration-ms "${{ env.SOAK_DURATION_MS }}" --output ".release-evidence/soak-${{ matrix.platform }}.json" --deterministic-output ".release-evidence/soak-fixture-${{ matrix.platform }}.json"
      - name: Emit sanitized platform manifest
        run: >-
          pnpm release:evidence-manifest platform
          --platform "${{ matrix.platform }}"
          --resource ".release-evidence/resource-${{ matrix.platform }}.json"
          --workflow "${{ github.repository }}/.github/workflows/nightly-release-evidence.yml"
          --soak ".release-evidence/soak-${{ matrix.platform }}.json"
          --fault ".release-evidence/soak-fixture-${{ matrix.platform }}.json"
          --lane "${{ env.EVIDENCE_LANE }}"
          --required-duration-ms "${{ env.REQUIRED_SOAK_DURATION_MS }}"
          --repository "${{ github.repository }}"
          --run-id "${{ github.run_id }}"
          --run-number "${{ github.run_number }}"
          --source-ref "${{ github.ref }}"
          --commit "${{ github.sha }}"
          --output ".release-evidence/platform-${{ matrix.platform }}.json"
      - name: Stage platform manifest for attestation
        run: node -e "require('node:fs').copyFileSync('.release-evidence/platform-${{ matrix.platform }}.json', 'platform-${{ matrix.platform }}.json')"
      - name: Upload platform evidence
        uses: actions/upload-artifact@v6
        with:
          name: release-evidence-${{ matrix.platform }}-${{ github.run_id }}
          if-no-files-found: error
          path: .release-evidence/
          include-hidden-files: true
      - name: Attest platform manifest with GitHub OIDC
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: platform-${{ matrix.platform }}.json
